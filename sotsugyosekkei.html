    h1 {

      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.02em;
      margin: 0 0 20px;
    }

    .document-meta {
      color: var(--sub);
      font-size: 12px;
      margin-bottom: 65px;
    }

    /* TABLE OF CONTENTS */

    .toc {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 24px 0;
      margin-bottom: 75px;
    }

    .toc-title {
      font-size: 11px;
      color: var(--sub);
      letter-spacing: 0.12em;
      margin-bottom: 15px;
    }

    .toc ol {
      padding-left: 22px;

    }

    .toc li {
      padding: 3px 0;
    }

    /* ESSAY */

    .essay-section {
      margin-bottom: 75px;
      scroll-margin-top: 30px;
    }

    h2 {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.6;
      margin: 0 0 30px;
    }

    .essay-section p {
      margin: 0 0 1.7em;
      text-align: left;
    }

    .essay-section p:last-child {
      margin-bottom: 0;
    }

    .essay-section a {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .endnote {
      color: var(--sub);
      font-size: 12px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--line);
      padding: 25px 24px 35px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--sub);
      font-size: 11px;
    }

    @media (max-width: 700px) {
      body {
        font-size: 13px;
      }

      header {
        padding: 16px;
      }

      main {
        padding: 125px 22px 30px;
      }

      .document-meta {
        margin-bottom: 45px;
      }

      .toc {
        margin-bottom: 55px;
      }

      .essay-section {
        margin-bottom: 60px;
      }

      h2 {
        font-size: 18px;
      }

        padding: 22px 16px 30px;

      }

/* IMAGES */

.essay-image {
  margin: 35px 0 45px;
}

.essay-image img {
  display: block;

  height: auto;
}

.essay-image figcaption {
  margin-top: 10px;
  color: var(--sub);
  font-size: 11px;
  line-height: 1.7;
}
    }
  </style>
</head>
<script>
  function reportHeight() {
    const header = document.querySelector("header");
    const main = document.querySelector("main");
    const footer = document.querySelector("footer");

    const contentBottom = Math.max(
      header.offsetHeight,
      main.offsetTop + main.offsetHeight
    );

    const totalHeight = contentBottom + footer.offsetHeight;

    parent.postMessage({
      type: "memorandum-height",
      height: totalHeight
    }, location.origin);
  }

  window.addEventListener("load", reportHeight);
  window.addEventListener("resize", reportHeight);
  setTimeout(reportHeight, 300);
</script>
